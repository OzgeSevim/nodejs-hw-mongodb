type: object
required:
  - id
  - name
  - email
properties:
  id:
    type: string
    format: uuid
    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
  name:
    type: string
    example: "John Doe"
  email:
    type: string
    format: email
    example: "johndoe@example.com"
  phoneNumber:
    type: string
    example: "+1234567890"
  isActive:
    type: boolean
    example: true
  createdAt:
    type: string
    format: date-time
    example: "2024-01-01T12:00:00Z"
  updatedAt:
    type: string
    format: date-time
    example: "2024-01-15T12:00:00Z"
