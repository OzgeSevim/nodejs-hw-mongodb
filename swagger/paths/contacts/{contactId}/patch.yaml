tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Update a contact's information
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: ID of the contact to update
    schema:
      type: string
      example: 650e1f8e2c9f3c001234abcd
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Updated name
            example: Jane Doe
          phoneNumber:
            type: string
            description: Updated phone number
            example: "5551234567"
          email:
            type: string
            format: email
            description: Updated email
            example: jane@example.com
          isFavourite:
            type: boolean
            description: Is this contact a favourite?
            example: false
          contactType:
            type: string
            description: Updated contact type
            enum: [work, home, personal]
            example: home
responses:
  "200":
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              $ref: "../../../components/schemas/contact.yaml"
  "401":
    $ref: "../../../components/responses/401.yaml"
  "404":
    $ref: "../../../components/responses/404.yaml"
